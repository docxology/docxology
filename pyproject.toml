[project]
name = "docxology"
version = "0.1.0"
description = "Public research, software, citation, evidence, and resume export index for Daniel Ari Friedman."
requires-python = ">=3.15"
dependencies = [
    "pillow>=13.0.0",
    # Kept in the base environment for resume-PDF verification and the
    # no-extra text fallback in extract_paper_texts.py.
    "pypdf>=5.0",
    "pytest>=8.0",
    # Parallel test execution for the hosted repository suite.
    "pytest-xdist>=3.6",
    # Parse the repository manuscript configuration with safe YAML semantics.
    "pyyaml>=6.0.2",
    "reportlab==4.5.1",
]

[project.optional-dependencies]
pdf-extraction = [
    "pymupdf>=1.24.3",
]
browser-qa = [
    "playwright>=1.52.0",
]

[dependency-groups]
lint = [
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "--strict-markers --strict-config -ra"
junit_family = "xunit1"  # Preserve Lighthouse's per-page record_property diagnostics.
markers = [
    "browser: real Chromium interaction or measurement; requires the browser-qa extra and installed Chromium",
    "lighthouse: real performance measurements; run serially apart from interaction workers",
    "manuscript_render: pinned native multi-format rendering; requires explicit template inputs and the documented toolchain",
]

[tool.ruff]
# Site data, the built Pages projection, and the virtualenv are not sources.
extend-exclude = [".venv", "_site", "reports"]
# Infer the syntax target from project.requires-python.

[tool.ruff.lint]
# Preserve the established gate explicitly across Ruff default changes:
# E4 import, E7 statement, E9 syntax, F pyflakes, plus the
# invalid-escape-sequence check the CI gate ran on its own before this config
# existed. Broader families (B, UP, SIM, I) are deliberately not enabled yet:
# they would rewrite most of `code/` in a single pass. Widen deliberately.
select = ["E4", "E7", "E9", "F", "W605"]

[tool.uv]
# This checkout-local application keeps source modules and repository data
# together; it is not an installable wheel or an implicit build target.
package = false
# Match the qualified CI frontend; older tools must fail before syncing.
required-version = ">=0.13.5"
# These native libraries require a wheel for the selected interpreter/platform.
# PyYAML retains its pure-Python source installation path.
no-build-package = ["pillow", "greenlet", "pymupdf"]
