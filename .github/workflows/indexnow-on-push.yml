# Submit index-priority URLs to IndexNow after a successful Pages deploy.
name: IndexNow
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy bounded GitHub Pages artifact"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          # Submit the URLs in the deployed candidate even if main advances
          # while this workflow_run job is queued.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Submit URLs to IndexNow
        run: python3 code/orchestrators/submit_indexnow.py
