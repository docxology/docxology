# Submit index-priority URLs to IndexNow after a successful Pages deploy.
name: IndexNow
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy bounded GitHub Pages artifact"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Submit the URLs in the deployed candidate even if main advances
          # while this workflow_run job is queued.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Submit URLs to IndexNow
        run: python3 code/orchestrators/submit_indexnow.py
