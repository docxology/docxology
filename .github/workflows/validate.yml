name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

# The committed dependency graph is a CI prerequisite.
env:
  UV_LOCKED: "1"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          # Full history so build_sitemap.py can derive per-URL <lastmod> from
          # git commit dates reproducibly (shallow checkout yields the single
          # fetched commit's date for every file → "Stale generated sitemap.xml").
          fetch-depth: 0
          # Commit-bound provenance manifests record the branch tip's payload
          # commit. The pull_request merge ref's first parent is the base
          # branch, so its first-parent diff is the entire PR and the tip
          # binding can never resolve there (observed: "stale Pages artifact
          # manifest (source_commit_at_generation)" for every content PR).
          # Validate the PR head commit instead of the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.13.5

      - name: Validate generated docs and structured data
        run: uv run python3 code/orchestrators/validate_repo.py

      - name: Run tests
        run: uv run python3 -m pytest code/tests -q -m "not browser and not manuscript_render" -n auto --dist loadfile

      - name: Lint Python sources (ruff default rules + W605)
        run: uv run --group lint ruff check code

      - name: Artifact budget gate (930 MiB)
        run: uv run python3 code/src/artifact_budget.py

      # Exercise the real Pages projection before main, including virtual PDF
      # copies and the dangling-report guard. This job has no deploy permission.
      - name: Assemble candidate Pages projection
        run: uv run python3 code/orchestrators/build_pages_artifact.py --output "$RUNNER_TEMP/docxology-pages" --check-size --check-manifest

      - name: Generator drift review (video + work pages)
        run: |
          uv run python3 code/orchestrators/build_video_pages.py --check
          uv run python3 code/orchestrators/build_work_pages.py --check

  browser-tests:
    uses: ./.github/workflows/browser-qa.yml
