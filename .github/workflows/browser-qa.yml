name: Required browser acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.6

      - name: Install browser QA dependencies
        run: uv sync --extra browser-qa

      - name: Install chromium
        run: uv run python -m playwright install --with-deps chromium

      - name: Install lighthouse
        run: npm install -g lighthouse@13.4.1

      - name: Rendered browser QA (nav, art grid, dropdown, axe, lighthouse)
        env:
          DOCXOLOGY_REQUIRE_BROWSER_QA: "1"
          DOCXOLOGY_LIGHTHOUSE_REPORT_DIR: /tmp/lighthouse-reports
        run: |
          uv run python3 -m pytest \
            code/tests/test_rendered_nav.py \
            code/tests/test_rendered_art_grid.py \
            code/tests/test_nav_more_dropdown.py \
            code/tests/test_axe_smoke.py \
            code/tests/test_rendered_work_pages.py \
            code/tests/test_rendered_frontend.py \
            code/tests/test_rendered_progressive_enhancement.py \
            code/tests/test_home_landing.py \
            code/tests/test_early_navigation.py \
            code/tests/test_service_worker.py \
            code/tests/test_lighthouse_budgets.py \
            -q

      - name: Retain Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-${{ github.sha }}
          path: /tmp/lighthouse-reports
          if-no-files-found: warn
          retention-days: 30
