name: Required browser acceptance

on:
  workflow_call:

permissions:
  contents: read

# The committed dependency graph is a CI prerequisite.
env:
  UV_LOCKED: "1"

jobs:
  browser-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.13.5

      - name: Install browser QA dependencies
        run: uv sync --extra browser-qa

      - name: Install chromium
        run: uv run python -m playwright install --with-deps chromium

      - name: Install lighthouse
        run: npm install -g lighthouse@13.4.1

      # Markers are collected from the tests; new browser tests cannot be
      # omitted by a stale hand-maintained list of filenames.
      - name: Rendered browser interactions
        run: uv run --extra browser-qa python3 -m pytest code/tests -q -m "browser and not lighthouse" -n 2 --dist loadfile

      # Keep measurement away from interaction workers to avoid CPU contention.
      - name: Lighthouse performance measurements
        env:
          DOCXOLOGY_LIGHTHOUSE_REPORT_DIR: /tmp/lighthouse-reports
        run: uv run --extra browser-qa python3 -m pytest code/tests -q -m lighthouse

      - name: Retain Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-${{ github.sha }}
          path: /tmp/lighthouse-reports
          if-no-files-found: warn
          retention-days: 30
