name: Deploy bounded GitHub Pages artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The committed dependency graph is a CI prerequisite.
env:
  UV_LOCKED: "1"

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    # The public deployment baseline is origin/main. A manually dispatched
    # workflow may select another ref, so do not validate/deploy it as Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          # The validator derives sitemap dates from Git history and the
          # artifact manifest may need to walk past a control-only commit.
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.13.5

      - name: Validate generated docs and structured data
        run: uv run python3 code/orchestrators/validate_repo.py

      - name: Run tests
        run: uv run python3 -m pytest code/tests -q -m "not browser and not manuscript_render" -n auto --dist loadfile

      - name: Lint Python sources (ruff default rules + W605)
        run: uv run --group lint ruff check code

      - name: Artifact budget gate (930 MiB)
        run: uv run python3 code/src/artifact_budget.py

  browser-tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/browser-qa.yml

  deploy:
    needs: [validate, browser-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          # The artifact manifest binds to the latest payload commit, which
          # may precede a control-only commit in the first-parent history.
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.13.5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # actions/configure-pages@v6.0.0

      - name: Assemble bounded public artifact
        run: uv run python3 code/orchestrators/build_pages_artifact.py --output _site --check-size --check-manifest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # actions/deploy-pages@v5.0.1
        with:
          # The ~0.9 GiB bounded artifact can sit in Pages' "syncing_files"
          # state past the action's 10-minute default; allow 30 minutes.
          timeout: 1800000

      - name: Verify deployed artifact against candidate SHA
        timeout-minutes: 15
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: uv run python3 code/orchestrators/verify_deployed_artifact.py --expected-commit "$CANDIDATE_SHA" --output /tmp/deployment-acceptance.json

      - name: Retain deployment acceptance receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: deployment-acceptance-${{ github.sha }}
          path: /tmp/deployment-acceptance.json
          if-no-files-found: error
          retention-days: 90
