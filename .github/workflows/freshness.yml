name: Public-source freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: public-source-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    env:
      FLICKR_SYNC_ENABLED: ${{ secrets.FLICKR_API_KEY != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh public-source snapshot
        # An authenticated GitHub rate limit keeps a throttled run from dropping
        # checks, which would otherwise read as drift (missing labels).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 code/orchestrators/refresh_public_sources.py --output reports/public_source_snapshot_latest.json --facts-output reports/public_source_snapshot_latest.facts.json
      - name: Check Flickr artwork export drift
        # Skipped (not failed) until the FLICKR_API_KEY repository secret is
        # set; the key itself is never printed or committed (see
        # docs/operations/publication-sync.md "Flickr artwork sync").
        if: ${{ env.FLICKR_SYNC_ENABLED == 'true' }}
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        run: python3 code/orchestrators/sync_flickr_artworks.py --check-drift

      - name: Compare with checked-in snapshot
        id: diff
        run: |
          # Glob only dated (YYYY-MM-DD) snapshots, which naturally excludes the
          # "_latest.json" file generated above: including it would make this
          # script pick itself as the baseline and diff the new snapshot against
          # itself, permanently reporting changed=false regardless of real drift.
          shopt -s nullglob
          candidates=(reports/public_source_snapshot_[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json)
          BASELINE="$(printf '%s\n' "${candidates[@]}" | sort | tail -n 1)"
          # Normalize BOTH sides identically before comparing. updated_at and
          # stargazers_count move with ordinary repository activity and are
          # telemetry, not curated claims; every other fact still counts: repo
          # and record totals, Zenodo first_* (newest-first, so deterministic),
          # renames, titles, DOIs, and the GitHub account type.
          NORMALIZE='walk(if type == "object" then del(.updated_at, .stargazers_count) else . end)'
          jq -S ".facts | $NORMALIZE" "$BASELINE" > reports/public_source_snapshot_baseline.facts.norm.json
          jq -S "$NORMALIZE" reports/public_source_snapshot_latest.facts.json > reports/public_source_snapshot_latest.facts.norm.json
          if cmp -s reports/public_source_snapshot_baseline.facts.norm.json reports/public_source_snapshot_latest.facts.norm.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Show which facts moved in the job log; diff exits 1 when files differ
            # (expected here) and 2 on trouble, which must still fail the step.
            diff -u reports/public_source_snapshot_baseline.facts.norm.json reports/public_source_snapshot_latest.facts.norm.json || test "$?" -eq 1
          fi
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"

      - name: Upload freshness artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-source-snapshot-latest
          path: reports/public_source_snapshot_latest.json

      - name: Open drift issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Public-source freshness drift detected"
          body="The scheduled public-source normalized facts differ from the latest checked-in baseline (${{ steps.diff.outputs.baseline }}). Review the uploaded workflow artifact, then update curated claims deliberately if the scope and source quality justify it."
          # The search term must be ONE argument. Escaped quotes (\"…\") are
          # literal characters to bash, not grouping, so they split this into
          # a quoted fragment plus a stray positional `in:title"`; gh rejects
          # the extra argument and `set -e` failed the job every week.
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated existing freshness issue #$existing"
          else
            gh issue create --title "$title" --label "evidence,verification" --body "$body"
          fi
