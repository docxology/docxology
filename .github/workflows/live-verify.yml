name: Verify live site

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy bounded GitHub Pages artifact"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-site-verification
  cancel-in-progress: true

jobs:
  verify-live:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOYMENT_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A workflow_run can queue after main advances. Verify the candidate
          # that actually triggered this job, rather than floating main HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Let CDN edges settle
        run: sleep 60

      - name: Enforce deploy freshness (live stamp == committed artifact stamp)
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          sys.path.insert(0, "code/src")
          from deploy_freshness import (
              DeployFreshnessError,
              extract_live_stamp,
              run_freshness_check,
          )
          # Freshness means "the live site serves the artifact that was just
          # deployed", not "the stamp equals main's HEAD": page stamps are
          # deliberately reused across non-rendering commits (see
          # build_stamp.reuse_or_current), so the homepage stamp can trail
          # HEAD indefinitely while the deploy is perfectly fresh. The stable
          # expectation is the stamp embedded in the checked-out artifact
          # itself — the same build the deploy workflow just published.
          index_html = pathlib.Path("index.html").read_text(encoding="utf-8")
          sha = extract_live_stamp(index_html)
          if not sha:
              raise SystemExit("committed index.html carries no build stamp")
          try:
              stamp = run_freshness_check(expected_sha=sha)
          except DeployFreshnessError as exc:
              raise SystemExit(str(exc))
          print(f"Deploy freshness OK: live stamp matches {stamp}")
          PY

      - name: Verify live site
        # Retain route/run diagnostics even when the preceding freshness alarm
        # fails; an older checked-in receipt cannot stand in for this attempt.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--expected-commit "$CANDIDATE_SHA" --output /tmp/live-site-verification.json)
          if [ -n "$DEPLOYMENT_RUN_ID" ]; then
            args+=(--deployment-run-id "$DEPLOYMENT_RUN_ID")
          fi
          python3 code/orchestrators/verify_live_site.py "${args[@]}"

      - name: Show summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/tmp/live-site-verification.json")
          if not path.is_file():
              print("Fresh live verification receipt was not produced; see the failed preflight step.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"Report: {path}")
          print(f"GitHub Pages status: {report['github_pages'].get('status')}")
          print(f"Passing checks: {report['passing']}/{report['checked_urls']}")
          print(f"Overall OK: {report['overall_ok']}")
          PY

      - name: Upload live verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-site-verification-${{ github.event.workflow_run.head_sha || github.sha }}
          path: /tmp/live-site-verification.json
          if-no-files-found: error
          retention-days: 90
