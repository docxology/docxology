name: Verify live site

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy bounded GitHub Pages artifact"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-site-verification
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Let CDN edges settle
        run: sleep 60

      - name: Enforce deploy freshness (live stamp == committed artifact stamp)
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          sys.path.insert(0, "code/src")
          from deploy_freshness import (
              DeployFreshnessError,
              extract_live_stamp,
              run_freshness_check,
          )
          # Freshness means "the live site serves the artifact that was just
          # deployed", not "the stamp equals main's HEAD": page stamps are
          # deliberately reused across non-rendering commits (see
          # build_stamp.reuse_or_current), so the homepage stamp can trail
          # HEAD indefinitely while the deploy is perfectly fresh. The stable
          # expectation is the stamp embedded in the checked-out artifact
          # itself — the same build the deploy workflow just published.
          index_html = pathlib.Path("index.html").read_text(encoding="utf-8")
          sha = extract_live_stamp(index_html)
          if not sha:
              raise SystemExit("committed index.html carries no build stamp")
          try:
              stamp = run_freshness_check(expected_sha=sha)
          except DeployFreshnessError as exc:
              raise SystemExit(str(exc))
          print(f"Deploy freshness OK: live stamp matches {stamp}")
          PY

      - name: Verify live site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 code/orchestrators/verify_live_site.py

      - name: Enforce live verification
        run: |
          python3 - <<'PY'
          import glob
          import json

          path = sorted(glob.glob("reports/live_site_verification_*.json"))[-1]
          report = json.load(open(path, encoding="utf-8"))
          hard_failures = [
              item for item in report.get("results", [])
              if not item.get("ok") and not item.get("deployment_pending")
          ]
          pages = report.get("github_pages", {})
          if not pages.get("ok") and not pages.get("deployment_pending"):
              hard_failures.append({"path": "GitHub Pages API", "status": pages.get("status")})
          if hard_failures:
              raise SystemExit(f"Live verification hard failures: {hard_failures}")
          if not report.get("overall_ok"):
              print("Live verification deferred only for explicitly classified deployment propagation.")
          PY

      - name: Show summary
        run: |
          python3 - <<'PY'
          import glob
          import json
          path = sorted(glob.glob("reports/live_site_verification_*.json"))[-1]
          report = json.load(open(path))
          print(f"Report: {path}")
          print(f"GitHub Pages status: {report['github_pages'].get('status')}")
          print(f"Passing checks: {report['passing']}/{report['checked_urls']}")
          print(f"Overall OK: {report['overall_ok']}")
          PY

      - name: Upload live verification report
        uses: actions/upload-artifact@v7
        with:
          name: live-site-verification
          path: reports/live_site_verification_*.json
