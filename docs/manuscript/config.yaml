# Repository-system manuscript configuration for docxology.
# Render formats express intended outputs; local validation does not render them.

paper:
  title: "docxology: Research, Software, and Citation Index"
  subtitle: "Source authority, progressive discovery, and commit-bound release evidence"
  version: "0.3.0-draft"
  date: "2026-10-13"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  doi: ""
  version_doi: ""
  version_record: ""
  github_repository: "docxology/docxology"
  year: "2026"
  transmission_bookends:
    enabled: false
    max_prior_releases: 5
    show_steganography: false

keywords:
  - "research index"
  - "software catalog"
  - "bibliography"
  - "profile repository"
  - "evidence catalog"

metadata:
  license: "CC-BY-4.0"
  language: "en"

manuscript_dir: "docs/manuscript"

render:
  toolchain:
    pandoc: "3.12.1"
    pandoc-crossref: "0.3.25"
    typst: "0.15.1"
  formats:
    pdf: true
    html: true
    slides: true
    docx: false
    epub: true

bibliography:
  references_path: "docs/manuscript/references.bib"
  fail_on_missing: true
  fail_on_unused: false
